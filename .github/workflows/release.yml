# Legitimate Trusted-Publishing publish. Used once to "validate" the
# configuration (npm docs: first successful publish binds the configuration
# to the repository's immutable identity).
name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.0.2)"
        required: true
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Node 22's bundled npm is 10.9.x, which has NO OIDC token exchange at all
      # (it only uses the Actions OIDC token for Sigstore). Trusted Publishing
      # needs npm >= 11.5.1, so install the current CLI explicitly.
      - name: Install current npm CLI
        run: npm install -g npm@latest
      - name: Show npm version and OIDC claims
        shell: bash
        run: |
          npm --version
          IDTOK=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "::add-mask::$IDTOK"
          python3 - "$IDTOK" <<'PY'
          import sys, json, base64
          p = sys.argv[1].split(".")[1]; p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print(json.dumps({k: c.get(k) for k in ("sub","repository","repository_id","repository_owner","repository_owner_id","workflow_ref","ref","event_name")}, indent=2))
          PY
      - name: Bump version (no git tag, no commit)
        run: npm version "${{ inputs.version }}" --no-git-tag-version
      - name: Publish via Trusted Publishing
        # --loglevel verbose so the OIDC exchange request/response (and any
        # "OIDC token exchange error - ..." message) shows up in the run log.
        shell: bash
        run: |
          set +e
          npm publish --provenance --access public --loglevel verbose > /tmp/publish.log 2>&1
          rc=$?
          grep -v -E '^npm (verb|sill|http) ' /tmp/publish.log
          echo "--- OIDC log lines ---"
          grep -E '^npm verb oidc' /tmp/publish.log || echo "(none — the CLI never attempted an exchange?)"
          exit $rc
      - name: Confirm the version landed
        run: npm view "$(node -p 'require("./package.json").name')@${{ inputs.version }}" version
